name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://catalog:catalog@localhost:5432/catalog
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Migrations apply, roll back and match the models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci
          SERVICE_TOKEN: ci
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  bot:
    name: bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/bot/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: [api, bot, web]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          sed -i 's/^BOT_TOKEN=$/BOT_TOKEN=1:ci/; s/^SERVICE_TOKEN=$/SERVICE_TOKEN=ci/; s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^MINIO_ROOT_PASSWORD=$/MINIO_ROOT_PASSWORD=ci-password/; s/^WEBHOOK_SECRET=$/WEBHOOK_SECRET=ci-webhook-secret-value/' .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - name: Check gateway config
        run: |
          docker run --rm -e S3_BUCKET=products -e WEBHOOK_PATH=/bot/webhook \
            -v "$PWD/deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            haproxy:3.2-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
      - name: Check Caddyfile
        run: |
          docker run --rm -e DOMAIN=example.com \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build images
        run: docker compose build

