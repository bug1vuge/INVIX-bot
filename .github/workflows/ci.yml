name: CI

on:
  push:
    branches: [main, smoke-check]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U catalog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://catalog:catalog@localhost:5432/catalog
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Migrations apply, roll back and match the models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci
          SERVICE_TOKEN: ci
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  bot:
    name: bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/bot/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: [api, bot, web]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          sed -i 's/^BOT_TOKEN=$/BOT_TOKEN=1:ci/; s/^SERVICE_TOKEN=$/SERVICE_TOKEN=ci/; s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^MINIO_ROOT_PASSWORD=$/MINIO_ROOT_PASSWORD=ci-password/; s/^WEBHOOK_SECRET=$/WEBHOOK_SECRET=ci-webhook-secret-value/' .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - name: Check gateway config
        run: |
          docker run --rm \
            -e S3_BUCKET=products -e WEBHOOK_PATH=/bot/webhook \
            --add-host api:127.0.0.1 --add-host web:127.0.0.1 \
            --add-host bot:127.0.0.1 --add-host minio:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$PWD/deploy/nginx/templates:/etc/nginx/templates:ro" \
            nginx:1.28-alpine nginx -t
      - name: Check Caddyfile
        run: |
          docker run --rm -e DOMAIN=example.com \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build images
        run: docker compose build

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^BOT_TOKEN=$|BOT_TOKEN=123456:smoke-test-token|' \
            -e 's|^ADMIN_IDS=$|ADMIN_IDS=1|' \
            -e 's|^WEBHOOK_SECRET=$|WEBHOOK_SECRET=smoke-webhook-secret-value|' \
            -e 's|^SERVICE_TOKEN=$|SERVICE_TOKEN=smoke-service-token|' \
            -e 's|^POSTGRES_PASSWORD=$|POSTGRES_PASSWORD=smoke-postgres|' \
            -e 's|^MINIO_ROOT_PASSWORD=$|MINIO_ROOT_PASSWORD=smoke-minio-password|' \
            -e 's|^HTTP_PORT=.*|HTTP_PORT=8080|' \
            .env
      - name: Probe images
        run: |
          out=""
          for img in quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z quay.io/minio/minio:latest minio/minio:latest pgsty/minio:latest bitnami/minio:latest cgr.dev/chainguard/minio:latest quay.io/minio/mc:latest; do
            if docker pull -q "$img" >/dev/null 2>&1; then
              v=$(docker run --rm --entrypoint sh "$img" -c 'minio --version 2>/dev/null | head -1; command -v mc >/dev/null && echo has-mc || echo no-mc' 2>&1 | tr '\n' ' ')
              out="$out%0AOK  $img :: $v"
            else
              out="$out%0AFAIL $img"
            fi
          done
          echo "::error title=probe::$out"
      - run: set -o pipefail; ./scripts/smoke-test.sh 2>&1 | tee smoke.log
      - name: Debug annotations
        if: failure()
        run: |
          enc() { python3 -c 'import sys; print(sys.stdin.read()[-6000:].replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          echo "::error title=smoke::$(enc < smoke.log)"
          docker compose -p catalog ps -a > ps.txt 2>&1 || true
          echo "::error title=ps::$(enc < ps.txt)"
          for s in gateway api web bot migrate minio; do
            docker compose -p catalog logs --no-color --tail=40 $s > $s.txt 2>&1 || true
            echo "::error title=$s::$(enc < $s.txt)"
          done
      - name: Logs on failure
        if: failure()
        run: docker compose -p catalog logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -p catalog down -v
