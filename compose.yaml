name: catalog

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-build: &api-build
  context: ./services/api

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-catalog}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-catalog}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET:-products}
  SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}

x-bot-env: &bot-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
  ADMIN_IDS: ${ADMIN_IDS:-}
  BOT_MODE: ${BOT_MODE:-webhook}
  WEBHOOK_BASE_URL: ${PUBLIC_URL:-}
  WEBHOOK_PATH: ${WEBHOOK_PATH:-/bot/webhook}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
  WEBAPP_URL: ${PUBLIC_URL:?set PUBLIC_URL}
  REDIS_URL: redis://redis:6379/0
  API_BASE_URL: http://gateway:8081
  SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN}

services:
  # --- stateful backing services ------------------------------------------

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # --- one-shot jobs: run once per deploy, never per replica ---------------

  migrate:
    build: *api-build
    image: catalog-api:${IMAGE_TAG:-latest}
    command: ["python", "-m", "app.cli", "bootstrap"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"
    logging: *logging

  bot-setup:
    build: ./services/bot
    image: catalog-bot:${IMAGE_TAG:-latest}
    command: ["python", "-m", "bot", "setup"]
    environment: *bot-env
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure:5
    logging: *logging

  # --- stateless services, scaled horizontally -----------------------------

  api:
    build: *api-build
    image: catalog-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: ${API_REPLICAS:-2}
    stop_grace_period: 30s
    logging: *logging

  bot:
    build: ./services/bot
    image: catalog-bot:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "bot", "serve"]
    environment: *bot-env
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: ${BOT_REPLICAS:-2}
    stop_grace_period: 30s
    logging: *logging

  web:
    build: ./services/web
    image: catalog-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://gateway:8081
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    stop_grace_period: 30s
    logging: *logging

  # --- edge -----------------------------------------------------------------

  gateway:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    environment:
      S3_BUCKET: ${S3_BUCKET:-products}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/bot/webhook}
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/gateway-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  minio-data:
