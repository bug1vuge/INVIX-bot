worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # Docker's embedded DNS. Upstreams are declared with `resolve`, so replicas
    # added or removed with `docker compose up --scale` are picked up without
    # reloading nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    # Trust X-Forwarded-For from the TLS edge (Caddy) on the docker networks.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Keep the id set by a client or the edge, otherwise generate one.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format json escape=json
        '{"ts":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_duration":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
    limit_req_status 429;

    # Proxy defaults; locations override what they need.
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # If a replica is down or restarting, try the next one. Non-idempotent
    # requests are only resent where the location explicitly allows it.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;

    proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:10m
                     max_size=1g inactive=7d use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
