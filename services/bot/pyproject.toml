[project]
name = "catalog-bot"
version = "1.0.0"
description = "Telegram bot for the product catalog"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.16,<3",
    "redis[hiredis]>=8.1,<9",
]

[dependency-groups]
dev = [
    "fakeredis>=2.32",
    "mypy>=1.18",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
