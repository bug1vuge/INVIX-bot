[project]
name = "catalog-api"
version = "1.0.0"
description = "Catalog HTTP API: products, images, health checks"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5,<16",
    "alembic>=1.20,<2",
    "asyncpg>=0.32,<1",
    "fastapi>=0.162,<1",
    "pillow>=13.0,<14",
    "pydantic-settings>=2.16,<3",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22",
    "httpx>=0.28",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
